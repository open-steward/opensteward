<!DOCTYPE html>
<html>
  <head>
    <title>OpenSteward — API Docs</title>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5/swagger-ui.css">
  </head>
  <body>
    <!--
      Static fallback console for serving docs/ straight off a file host
      (GitHub Pages and the like). The docs-server renders the real one at
      /unified-api — this page has no nav, no theme and no vertical rail.

      StandaloneLayout lives in swagger-ui-standalone-preset.js and is exposed
      as its own global; it is not a property of SwaggerUIBundle. Both scripts
      have to load, and both are pinned to the same major the docs-server uses.
    -->
    <div id="swagger-ui"></div>
    <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
    <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-standalone-preset.js"></script>
    <script>
      SwaggerUIBundle({
        url: './openapi/openapi.yaml',
        dom_id: '#swagger-ui',
        presets: [SwaggerUIBundle.presets.apis, SwaggerUIStandalonePreset],
        layout: 'StandaloneLayout',
        deepLinking: true
      })
    </script>
  </body>
</html>
