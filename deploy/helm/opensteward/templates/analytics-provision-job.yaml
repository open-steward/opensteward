{{- include "opensteward.validateAnalytics" . }}
{{- $s := .Values.analytics.sqlAccess }}
{{- if and $s.enabled $s.provisionJob.enabled $s.adminDatabaseUrl.existingSecret }}
{{- $full := include "opensteward.fullname" . }}
# Read-only SQL access, managed mode: after every install/upgrade, ask
# integration-server to (re)provision the masked analytics views, schemas and
# grants. integration-server also provisions on boot when the view catalog
# changed; this hook makes an upgrade wait for it (and repairs grants), before
# the Superset bootstrap (hook weight 10) connects to the views.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $full }}-analytics-provision
  labels:
    {{- include "opensteward.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        {{- include "opensteward.labels" . | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      serviceAccountName: {{ include "opensteward.serviceAccountName" . }}
      securityContext:
        {{- include "opensteward.podSecurityContext" . | nindent 8 }}
      containers:
        - name: provision
          image: {{ $s.provisionJob.image | default .Values.secrets.generate.image }}
          imagePullPolicy: {{ .Values.secrets.generate.imagePullPolicy }}
          securityContext:
            {{- include "opensteward.containerSecurityContext" . | nindent 12 }}
          env:
            - name: HOME
              value: /tmp
            - name: IS_URL
              value: "http://{{ $full }}-integration-server:3010"
            - name: ADMIN_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "opensteward.secretName" . }}
                  key: ADMIN_SECRET
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              i=0
              until curl -fsS "$IS_URL/health" >/dev/null; do
                i=$((i + 1)); [ "$i" -ge 60 ] && { echo "integration-server not healthy" >&2; exit 1; }
                sleep 5
              done
              curl -fsS -X POST \
                -H "X-Admin-Secret: $ADMIN_SECRET" \
                -H 'X-OpenSteward-Data-Scope: {"tenants":"*"}' \
                "$IS_URL/admin/analytics/provision"
              echo
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}
