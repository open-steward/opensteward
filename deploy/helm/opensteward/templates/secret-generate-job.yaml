{{- if eq .Values.secrets.source "generate" }}
{{- $name := printf "%s-secret-generate" (include "opensteward.fullname" .) }}
{{- $secret := include "opensteward.secretName" . }}
# One-command trial secrets. A pre-install/pre-upgrade hook Job idempotently
# creates <release>-secrets: it fills any MISSING JWT/SESSION, creates STORE_SECRET
# only when absent, and NEVER overwrites an existing STORE_SECRET (that would orphan
# every encrypted-at-rest value). The Secret is created via kubectl, so it is NOT
# Helm-owned and survives `helm uninstall` — keeping the decryption key.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  labels:
    {{- include "opensteward.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  labels:
    {{- include "opensteward.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
rules:
  # Scoped to the one Secret this chart manages.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  labels:
    {{- include "opensteward.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}
  labels:
    {{- include "opensteward.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        {{- include "opensteward.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ $name }}
      restartPolicy: Never
      securityContext:
        {{- include "opensteward.podSecurityContext" . | nindent 8 }}
      containers:
        - name: generate
          image: {{ .Values.secrets.generate.image }}
          imagePullPolicy: {{ .Values.secrets.generate.imagePullPolicy }}
          securityContext:
            {{- include "opensteward.containerSecurityContext" . | nindent 12 }}
          env:
            - name: HOME
              value: /tmp
            - name: NS
              value: {{ .Release.Namespace }}
            - name: SECRET
              value: {{ $secret }}
            - name: INCLUDE_ADMIN
              value: {{ .Values.secrets.generate.includeAdminSecret | quote }}
            - name: GEN_BOOTSTRAP
              value: {{ .Values.secrets.generate.bootstrapToken | quote }}
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              gen() { head -c 32 /dev/urandom | base64 | tr -d '\n=+/' | cut -c1-44; }
              # present "$1": is key $1 set on the Secret? Distinguishes a real read
              # error (-> abort) from a genuinely-absent key (-> "absent"), so the
              # never-overwrite STORE_SECRET guard cannot be tricked by a transient
              # API error into the create-fresh branch.
              present() {
                v=$(kubectl -n "$NS" get secret "$SECRET" -o "jsonpath={.data.$1}") || {
                  echo "FATAL: could not read $SECRET/$1" >&2; exit 1; }
                [ -n "$v" ]
              }
              if kubectl -n "$NS" get secret "$SECRET" >/dev/null 2>&1; then
                echo "Secret $SECRET exists — filling only missing keys."
                KEYS="JWT_SECRET SESSION_SECRET SERVICE_SECRET"
                [ "$INCLUDE_ADMIN" = "true" ] && KEYS="$KEYS ADMIN_SECRET"
                [ "$GEN_BOOTSTRAP" = "true" ] && KEYS="$KEYS BOOTSTRAP_TOKEN"
                for k in $KEYS; do
                  if ! present "$k"; then
                    kubectl -n "$NS" patch secret "$SECRET" --type merge -p "{\"stringData\":{\"$k\":\"$(gen)\"}}"
                    echo "  added $k"
                  fi
                done
                if present STORE_SECRET; then
                  echo "  STORE_SECRET present — left untouched (overwrite would orphan encrypted data)."
                else
                  kubectl -n "$NS" patch secret "$SECRET" --type merge -p "{\"stringData\":{\"STORE_SECRET\":\"$(gen)\"}}"
                  echo "  added STORE_SECRET (was absent)"
                fi
              else
                echo "Creating $SECRET (first install)."
                ARGS="--from-literal=JWT_SECRET=$(gen) --from-literal=SESSION_SECRET=$(gen) --from-literal=STORE_SECRET=$(gen) --from-literal=SERVICE_SECRET=$(gen)"
                [ "$INCLUDE_ADMIN" = "true" ] && ARGS="$ARGS --from-literal=ADMIN_SECRET=$(gen)"
                [ "$GEN_BOOTSTRAP" = "true" ] && ARGS="$ARGS --from-literal=BOOTSTRAP_TOKEN=$(gen)"
                kubectl -n "$NS" create secret generic "$SECRET" $ARGS
                kubectl -n "$NS" label secret "$SECRET" \
                  app.kubernetes.io/managed-by=Helm app.kubernetes.io/part-of=opensteward --overwrite
              fi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}
