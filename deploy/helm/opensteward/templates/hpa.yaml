{{- $root := . -}}
{{- $sqlite := eq .Values.database.mode "sqlite" -}}
{{- range $name, $svc := .Values.services }}
{{- $single := and $svc.stateful $sqlite -}}
{{/* No HPA for a single-writer SQLite service (can't scale past 1 replica). */}}
{{- if and $svc.autoscaling.enabled (not $single) }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "opensteward.fullname" $root }}-{{ $name }}
  labels:
    {{- include "opensteward.serviceLabels" (dict "root" $root "name" $name) | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "opensteward.fullname" $root }}-{{ $name }}
  minReplicas: {{ $svc.autoscaling.minReplicas }}
  maxReplicas: {{ $svc.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $svc.autoscaling.targetCPU }}
{{- end }}
{{- end }}
