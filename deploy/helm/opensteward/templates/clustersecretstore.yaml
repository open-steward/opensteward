{{- if and (eq .Values.secrets.source "externalSecrets") .Values.secrets.externalSecrets.createStore }}
{{- $es := .Values.secrets.externalSecrets }}
{{- $sa := include "opensteward.serviceAccountName" . }}
# Convenience store for trials. For production prefer an operator-managed
# (Cluster)SecretStore (set createStore=false + secretStore.name). Auth uses the
# chart ServiceAccount — set serviceAccount.annotations for IRSA / Workload Identity.
apiVersion: {{ $es.apiVersion }}
kind: ClusterSecretStore
metadata:
  name: {{ include "opensteward.fullname" . }}-store
  labels:
    {{- include "opensteward.labels" . | nindent 4 }}
spec:
  provider:
    {{- if eq $es.provider "aws" }}
    aws:
      service: SecretsManager
      region: {{ required "secrets.externalSecrets.aws.region is required for provider=aws" $es.aws.region }}
      auth:
        jwt:
          serviceAccountRef:
            name: {{ $sa }}
            namespace: {{ .Release.Namespace }}
    {{- else if eq $es.provider "azure" }}
    azurekv:
      authType: WorkloadIdentity
      vaultUrl: {{ required "secrets.externalSecrets.azure.vaultUrl is required for provider=azure" $es.azure.vaultUrl }}
      {{- with $es.azure.tenantId }}
      tenantId: {{ . }}
      {{- end }}
      serviceAccountRef:
        name: {{ $sa }}
        namespace: {{ .Release.Namespace }}
    {{- else if eq $es.provider "gcp" }}
    gcpsm:
      projectID: {{ required "secrets.externalSecrets.gcp.projectID is required for provider=gcp" $es.gcp.projectID }}
      auth:
        workloadIdentity:
          clusterLocation: {{ required "secrets.externalSecrets.gcp.clusterLocation is required for provider=gcp" $es.gcp.clusterLocation }}
          clusterName: {{ required "secrets.externalSecrets.gcp.clusterName is required for provider=gcp" $es.gcp.clusterName }}
          serviceAccountRef:
            name: {{ $sa }}
            namespace: {{ .Release.Namespace }}
    {{- end }}
{{- end }}
