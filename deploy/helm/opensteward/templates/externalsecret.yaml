{{- if eq .Values.secrets.source "externalSecrets" }}
{{- $es := .Values.secrets.externalSecrets }}
# External Secrets Operator syncs <release>-secrets from a cloud secret store.
# The Secret is created/owned by ESO; pods envFrom it (see deployment.yaml).
apiVersion: {{ $es.apiVersion }}
kind: ExternalSecret
metadata:
  name: {{ include "opensteward.secretName" . }}
  labels:
    {{- include "opensteward.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ $es.refreshInterval | quote }}
  secretStoreRef:
    {{- if $es.createStore }}
    name: {{ include "opensteward.fullname" . }}-store
    kind: ClusterSecretStore
    {{- else }}
    name: {{ required "secrets.externalSecrets.secretStore.name is required unless createStore=true" $es.secretStore.name }}
    kind: {{ $es.secretStore.kind }}
    {{- end }}
  target:
    name: {{ include "opensteward.secretName" . }}
    creationPolicy: Owner
    template:
      type: Opaque
  {{- if $es.remoteSecretName }}
  # One remote secret (JSON) whose properties are JWT_SECRET, SESSION_SECRET, …
  dataFrom:
    - extract:
        key: {{ $es.remoteSecretName }}
  {{- else }}
  data:
    - secretKey: JWT_SECRET
      remoteRef:
        key: {{ required "secrets.externalSecrets.keys.jwtSecret is required when remoteSecretName is empty" $es.keys.jwtSecret }}
    - secretKey: SESSION_SECRET
      remoteRef:
        key: {{ required "secrets.externalSecrets.keys.sessionSecret is required when remoteSecretName is empty" $es.keys.sessionSecret }}
    - secretKey: STORE_SECRET
      remoteRef:
        key: {{ required "secrets.externalSecrets.keys.storeSecret is required when remoteSecretName is empty" $es.keys.storeSecret }}
    {{- with $es.keys.adminSecret }}
    - secretKey: ADMIN_SECRET
      remoteRef:
        key: {{ . }}
    {{- end }}
    {{- with $es.keys.serviceSecret }}
    - secretKey: SERVICE_SECRET
      remoteRef:
        key: {{ . }}
    {{- end }}
    {{- with $es.keys.bootstrapToken }}
    - secretKey: BOOTSTRAP_TOKEN
      remoteRef:
        key: {{ . }}
    {{- end }}
  {{- end }}
{{- end }}
