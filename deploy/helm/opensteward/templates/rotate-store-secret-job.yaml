{{- if .Values.rotation.enabled }}
{{- $root := . }}
{{- $r := .Values.rotation }}
{{- $full := include "opensteward.fullname" . }}
{{- $name := printf "%s-rotate-store-secret" $full }}
{{- $pg := eq $r.target "postgres" }}
{{- $stateful := list "admin-api" "webhook-gateway" "integration-server" }}
{{- $rotatable := list "admin-api" "integration-server" }}
{{- if not $pg }}{{- if not (has $r.target $rotatable) }}{{- fail (printf "rotation.target must be postgres or one of %v (webhook-gateway holds no encrypted data), got %q" $rotatable $r.target) }}{{- end }}{{- end }}
{{- $defaultDbs := dict "admin-api" (list "/app/apps/admin-api/data/admin.db") "integration-server" (list "/app/apps/integration-server/data/credentials.db" "/app/apps/integration-server/data/resources.db") }}
{{- $dbPaths := $r.sqlitePaths }}
{{- if and (not $pg) (not $dbPaths) }}{{- $dbPaths = index $defaultDbs $r.target }}{{- end }}
# STORE_SECRET rotation Job (rotation.enabled=true). Re-encrypts every
# encrypted-at-rest column under NEW_STORE_SECRET. Enabling rotation ALSO scales the
# stateful Deployments to 0 (see deployment.yaml), so the same `helm upgrade` that
# renders this Job quiesces the writers — no out-of-band `kubectl scale` race. An
# init container REFUSES to proceed unless every stateful Deployment is at 0/0.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  labels:
    {{- include "opensteward.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  labels:
    {{- include "opensteward.labels" . | nindent 4 }}
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  labels:
    {{- include "opensteward.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}
  labels:
    {{- include "opensteward.labels" . | nindent 4 }}
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        {{- include "opensteward.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ $name }}
      restartPolicy: Never
      securityContext:
        {{- include "opensteward.podSecurityContext" . | nindent 8 }}
      initContainers:
        # Fail CLOSED: refuse unless every stateful Deployment reads back 0 ready
        # AND 0 desired. A read error (RBAC, API blip, wrong name) aborts — it is
        # never treated as "quiesced".
        - name: assert-quiesced
          image: {{ .Values.secrets.generate.image }}
          imagePullPolicy: {{ .Values.secrets.generate.imagePullPolicy }}
          securityContext:
            {{- include "opensteward.containerSecurityContext" . | nindent 12 }}
          env:
            - name: HOME
              value: /tmp
            - name: NS
              value: {{ .Release.Namespace }}
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              for d in {{ join " " $stateful }}; do
                dep="{{ $full }}-$d"
                out=$(kubectl -n "$NS" get deploy "$dep" \
                  -o 'jsonpath={.spec.replicas}/{.status.readyReplicas}' 2>/tmp/err) || {
                    if grep -qi 'notfound\|not found' /tmp/err; then
                      echo "$dep absent — skipping."; continue
                    fi
                    echo "REFUSING: could not read $dep: $(cat /tmp/err)" >&2; exit 1
                  }
                spec=$(echo "$out" | cut -d/ -f1); spec=${spec:-0}
                ready=$(echo "$out" | cut -d/ -f2); ready=${ready:-0}
                if [ "$spec" != "0" ] || [ "$ready" != "0" ]; then
                  echo "REFUSING: $dep is spec=$spec ready=$ready (need 0/0). Set rotation.enabled=true via helm upgrade to scale writers down." >&2
                  exit 1
                fi
              done
              echo "All stateful Deployments quiesced (0/0)."
              {{- if not $pg }}
              # SQLite: let the WAL age past the tool's 60s live-writer guard.
              echo "Waiting {{ $r.quiesceWaitSeconds }}s for WAL to age out…"
              sleep {{ $r.quiesceWaitSeconds }}
              {{- end }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      containers:
        - name: rotate
          image: {{ $r.image | default (include "opensteward.image" (dict "root" $root "name" "integration-server")) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- include "opensteward.containerSecurityContext" . | nindent 12 }}
          env:
            - name: OLD_STORE_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ required "rotation.existingSecret is required when rotation.enabled" $r.existingSecret }}
                  key: OLD_STORE_SECRET
            - name: NEW_STORE_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $r.existingSecret }}
                  key: NEW_STORE_SECRET
            {{- if $pg }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ required "database.external.existingSecret is required for rotation.target=postgres" .Values.database.external.existingSecret }}
                  key: {{ .Values.database.external.secretKey }}
            {{- end }}
          command:
            - node
            - /app/packages/shared/dist/scripts/rotate-store-secret.js
          args:
            - "--old"
            - "$(OLD_STORE_SECRET)"
            - "--new"
            - "$(NEW_STORE_SECRET)"
            {{- if $pg }}
            - "--database-url"
            - "$(DATABASE_URL)"
            {{- else }}
            {{- range $p := $dbPaths }}
            - "--db"
            - {{ $p | quote }}
            {{- end }}
            {{- end }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if not $pg }}
            - name: data
              mountPath: /app/apps/{{ $r.target }}/data
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if not $pg }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ $full }}-{{ $r.target }}-data
        {{- end }}
{{- end }}
