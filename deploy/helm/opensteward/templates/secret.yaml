{{- if eq .Values.secrets.source "plain" }}
# DEV / TRIAL ONLY. These values land in the Helm release history and
# `helm get values`. For production use secrets.source=existingSecret (an
# operator-managed Secret, or one synced by External Secrets Operator /
# sealed-secrets — see secrets.* in values.yaml and the chart README).
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-secrets" (include "opensteward.fullname" .) }}
  labels:
    {{- include "opensteward.labels" . | nindent 4 }}
type: Opaque
stringData:
  JWT_SECRET: {{ required "secrets.plain.jwtSecret is required when secrets.source=plain" .Values.secrets.plain.jwtSecret | quote }}
  SESSION_SECRET: {{ required "secrets.plain.sessionSecret is required when secrets.source=plain" .Values.secrets.plain.sessionSecret | quote }}
  STORE_SECRET: {{ required "secrets.plain.storeSecret is required when secrets.source=plain" .Values.secrets.plain.storeSecret | quote }}
  {{- with .Values.secrets.plain.adminSecret }}
  ADMIN_SECRET: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.plain.serviceSecret }}
  SERVICE_SECRET: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.plain.bootstrapToken }}
  BOOTSTRAP_TOKEN: {{ . | quote }}
  {{- end }}
{{- end }}
