version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 10
    versioning-strategy: increase
    ignore:
      # packages/sdk/scripts/sdk-codegen.ts hands a createConfig() result to
      # openapi-typescript, which bundles @redocly/openapi-core ^1 and crashes
      # on a v2 config (docs:all fails). Lift once openapi-typescript
      # supports v2.
      - dependency-name: "@redocly/openapi-core"
        update-types: ["version-update:semver-major"]
    labels:
      - dependencies
    groups:
      production-minor-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
        dependency-type: production
      dev-minor-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
        dependency-type: development

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - docker
